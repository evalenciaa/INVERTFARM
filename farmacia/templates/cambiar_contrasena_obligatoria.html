<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actualiza tu contraseña | INVENTFARM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width: 34rem;">
    <section class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4">Crea tu contraseña personal</h1>
      <p class="text-muted">Por seguridad, debes reemplazar la contraseña temporal antes de continuar.</p>
      <form method="post" novalidate>{% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
          <div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>
        {% endfor %}
        <button class="btn btn-primary w-100" type="submit">Guardar contraseña</button>
      </form>
    </div></section>
  </main>
</body>
</html>
